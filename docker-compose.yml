version: '3.8'

services:
  chatery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatery-whatsapp-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin123}
      - API_KEY=${API_KEY:-}
      - SYNC_FULL_HISTORY=${SYNC_FULL_HISTORY:-false}
      - AUTO_DOWNLOAD_MEDIA=${AUTO_DOWNLOAD_MEDIA:-true}
      - MAX_MESSAGES_PER_CHAT=${MAX_MESSAGES_PER_CHAT:-100}
      - NODE_OPTIONS=--openssl-legacy-provider --max-old-space-size=2048
    volumes:
      # Host bind mount for WhatsApp sessions (creds, config.json, and store.json)
      # Stored and directly visible in host project folder ./sessions
      - ./sessions:/app/sessions
      # Host bind mount for received media files
      # Stored and directly visible in host project folder ./public/media
      - ./public/media:/app/public/media
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chatery-network

networks:
  chatery-network:
    driver: bridge
